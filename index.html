<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kalori Atlası | Besinlerin Kalori ve Makro Değerleri</title>

  <meta
    name="description"
    content="Yüzlerce besinin kalori, protein, karbonhidrat ve yağ değerlerini keşfedin. Besin arayın, kategorileri filtreleyin ve günlük kalori ihtiyacınızı hesaplayın."
  >

  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://www.kaloriatlas.com/"
  >

  <meta property="og:locale" content="tr_TR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kalori Atlası">

  <meta
    property="og:title"
    content="Kalori Atlası | Besinlerin Kalori ve Makro Değerleri"
  >

  <meta
    property="og:description"
    content="Besinlerin kalori ve makro değerlerini keşfedin, günlük kalori ihtiyacınızı kolayca hesaplayın."
  >

  <meta
    property="og:url"
    content="https://www.kaloriatlas.com/"
  >

  <meta name="twitter:card" content="summary">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="hero-section text-center">
    <div class="container">
            <div class="d-flex justify-content-end mb-3">
        <a
          href="hesaplayici.html"
          class="btn btn-light fw-bold text-primary"
        >
          🧮 Kalori Hesapla
        </a>
      </div>
      <h1 class="display-4 fw-bold">Kalori Atlası</h1>

      <p class="lead">
        200 Geniş Verili Besin Rehberi ve Makro Değerleri
      </p>

      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <input
            type="text"
            id="searchInput"
            class="form-control form-control-lg"
            placeholder="Besin adı veya kategori yazın..."
            autocomplete="off"
          >
        </div>
      </div>
    </div>
      <div class="container mt-4">
    <div
      id="categoryFilters"
      class="d-flex flex-wrap justify-content-center gap-2"
    ></div>
  </div>
  </header>

  <main class="container my-5">
    <div class="row mb-5">
      <div class="col-12">
        <div class="table-responsive bg-white p-3 rounded shadow-sm">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Besin Adı</th>
                <th>Kategori</th>
                <th>Miktar / Porsiyon</th>
                <th>Kalori (kcal)</th>
                <th>Protein (g)</th>
                <th>Karbonhidrat (g)</th>
                <th>Yağ (g)</th>
              </tr>
            </thead>

            <tbody id="resultsBody">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">
                  Besin verileri yükleniyor...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-muted border-top">
    <p class="mb-0">
      © 2026 Kalori Atlası — Tüm Hakları Saklıdır.
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
