<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalori Atlası - Besin Rehberi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-section { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; padding: 60px 0; }
    .badge-macro { font-size: 0.85rem; padding: 6px 10px; }
  </style>
</head>
<body>

  <header class="hero-section text-center">
    <div class="container">
      <h1 class="display-4 fw-bold">Kalori Atlası</h1>
      <p class="lead">Özel veritabanımızdan besin değerlerini hızlıca arayın.</p>
      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Besin adı yazın (Örn: Köfte, Yumurta, Muz)..." autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <div class="row mb-5">
      <div class="col-12">
        <div class="table-responsive bg-white p-3 rounded shadow-sm">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Besin Adı</th>
                <th>Kategori</th>
                <th>Miktar / Porsiyon</th>
                <th>Kalori (kcal)</th>
                <th>Protein (g)</th>
                <th>Karbonhidrat (g)</th>
                <th>Yağ (g)</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">Veriler yükleniyor...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-muted border-top">
    <p class="mb-0">© 2026 Kalori Atlası — Tüm Hakları Saklıdır.</p>
  </footer>

  <script>
    let foodsData = [];

    // foods.json dosyasından verileri çekme
    fetch('foods.json')
      .then(response => response.json())
      .then(data => {
        foodsData = data;
        renderTable(foodsData);
      })
      .catch(err => {
        document.getElementById('resultsBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Veri yüklenirken bir hata oluştu.</td></tr>';
      });

    function renderTable(data) {
      const resultsBody = document.getElementById('resultsBody');
      resultsBody.innerHTML = '';

      if (data.length === 0) {
        resultsBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Sonuç bulunamadı.</td></tr>';
        return;
      }

      data.forEach(item => {
        const row = `
          <tr>
            <td><strong>${item.name}</strong></td>
            <td><span class="badge bg-light text-dark border">${item.category || 'Genel'}</span></td>
            <td>${item.portion}</td>
            <td>${item.calories}</td>
            <td><span class="badge bg-success badge-macro">${item.protein}g</span></td>
            <td><span class="badge bg-primary badge-macro">${item.carbs}g</span></td>
            <td><span class="badge bg-warning text-dark badge-macro">${item.fat}g</span></td>
          </tr>
        `;
        resultsBody.innerHTML += row;
      });
    }

    // Anlık arama filtresi
    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      const filtered = foodsData.filter(item => item.name.toLowerCase().includes(query) || (item.category && item.category.toLowerCase().includes(query)));
      renderTable(filtered);
    });
  </script>
</body>
</html>
